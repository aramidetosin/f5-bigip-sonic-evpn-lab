ltm monitor http mon-api {
    defaults-from http
    interval 5
    timeout 16
    send "GET /api/v1/health HTTP/1.1\r\nHost: api.f5lab.test\r\nConnection: close\r\n\r\n"
    recv "\"status\":\"ok\""
}
ltm pool pool-api {
    monitor mon-api
    members {
        server1:8080 { address 10.20.0.11 }
        server2:8080 { address 10.20.0.12 }
        server3:8080 { address 10.20.0.13 }
    }
}
ltm virtual vs-api {
    destination 10.20.30.101:http
    ip-protocol tcp
    mask 255.255.255.255
    pool pool-api
    profiles {
        http { }
        tcp { }
    }
    source-address-translation {
        pool snat-web
        type snat
    }
}
