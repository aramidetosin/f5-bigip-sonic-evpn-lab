ltm pool pool-siteb {
    monitor http-app
    members {
        server1:http { address 10.20.0.11 }
        server2:http { address 10.20.0.12 }
        server3:http { address 10.20.0.13 }
    }
}
ltm virtual vs-siteb {
    destination 10.20.5.140:http
    ip-protocol tcp
    mask 255.255.255.255
    pool pool-siteb
    profiles {
        http { }
        tcp { }
    }
    source-address-translation {
        type automap
    }
}
ltm virtual-address 10.20.5.140 {
    address 10.20.5.140
    mask 255.255.255.255
    route-advertisement any
}
