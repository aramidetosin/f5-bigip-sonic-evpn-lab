# Part 24: the AI front door as an AS3 declaration in a ConfigMap, read by the second CIS (cis-ai.yaml).
#   ai.f5lab.test = 10.20.30.130:80 > pool llm_pool: least connections, at most 4 concurrent connections per pod (= its 4 "GPU slots"),
#   slow ramp 30 s for new pods; HTTP monitor on /health. The members are left empty: CIS fills them from the Service llm (labels).
#   http profile: no response buffering issues for Server-Sent Events; tcp idle timeout 300 s for long streams.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-as3
  namespace: ai
  labels:
    f5type: virtual-server
    as3: "true"
data:
  template: |
    {
      "class": "AS3",
      "action": "deploy",
      "persist": true,
      "declaration": {
        "class": "ADC",
        "schemaVersion": "3.56.0",
        "id": "f5lab-ai-front-door",
        "f5lab_ai": {
          "class": "Tenant",
          "ai": {
            "class": "Application",
            "template": "http",
            "serviceMain": {
              "class": "Service_HTTP",
              "virtualAddresses": ["10.20.30.130"],
              "virtualPort": 80,
              "pool": "llm_pool",
              "snat": "auto",
              "profileTCP": {"use": "tcp_stream"},
              "persistenceMethods": []
            },
            "tcp_stream": {"class": "TCP_Profile", "idleTimeout": 300},
            "llm_pool": {
              "class": "Pool",
              "loadBalancingMode": "least-connections-member",
              "slowRampTime": 30,
              "monitors": [{"use": "llm_health"}],
              "members": [{"servicePort": 8080, "serverAddresses": [], "shareNodes": true, "connectionLimit": 4}]
            },
            "llm_health": {
              "class": "Monitor",
              "monitorType": "http",
              "send": "GET /health HTTP/1.1\r\nHost: ai.f5lab.test\r\nConnection: close\r\n\r\n",
              "receive": "OK",
              "interval": 5,
              "timeout": 16
            }
          }
        }
      }
    }
